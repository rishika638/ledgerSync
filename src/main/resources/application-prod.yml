server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax

spring:
  application:
    name: ledgersync
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: LedgerSyncProdHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health,readiness,liveness,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

ledgersync:
  security:
    enabled: true
    header-name: X-API-Key
    cors:
      allowed-origins: ${LEDGERSYNC_CORS_ALLOWED_ORIGINS}
    operator:
      username: ${LEDGERSYNC_OPERATOR_USERNAME}
      password: ${LEDGERSYNC_OPERATOR_PASSWORD}
    admin:
      username: ${LEDGERSYNC_ADMIN_USERNAME}
      password: ${LEDGERSYNC_ADMIN_PASSWORD}
    api-keys:
      ingestion: ${LEDGERSYNC_SECURITY_API_KEYS_INGESTION}
      operator: ${LEDGERSYNC_SECURITY_API_KEYS_OPERATOR}
      admin: ${LEDGERSYNC_SECURITY_API_KEYS_ADMIN}
  webhook:
    stripe:
      secret: ${LEDGERSYNC_WEBHOOK_STRIPE_SECRET}
      tolerance-seconds: 300
    razorpay:
      secret: ${LEDGERSYNC_WEBHOOK_RAZORPAY_SECRET}
      tolerance-seconds: 300
  inbox:
    enabled: ${LEDGERSYNC_INBOX_WORKER_ENABLED:true}
    poll-interval-ms: 2000
    batch-size: 50
    max-retries: 5
  reconciliation:
    enabled: true
    cron: ${LEDGERSYNC_RECONCILIATION_CRON:0 */15 * * * *}
    batch-size: 100
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
